<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cambio-Contraseña</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/contraseña.css">
</head>

<body>
  
  <section class="titulos">
    <h2>¿Olvidaste tu contraseña?</h2>
  </section>
  <section class="titulos">
    <p>Ingresa tu correo electrónico al que te llegará un código de verificación.</p>
  </section>
  <div>
    <img src="../imagenes/zorro sentao.jpg" width="200px" class="img-fluid rounded shadow boss card d-flex">
  </div>
  <form class="card d-flex">
    <div class="text-center ">
      <label for="confirm" class="confirm-email longitud">Correo Electrónico</label>
      <br>
      <input type="email" id="confirm" placeholder="julian123@gmail.com" class="longitud">
    </div>
    <div class="text-center mt-2">
      <button type="submit" class="btn btn-dark m-3 longitud" >
        Enviar Código
      </button>
    </div>

    <a href="./Formulario.html" class="volver">Volver al inicio de seción</a>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
