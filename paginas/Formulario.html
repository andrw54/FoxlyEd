<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="../css/formulario.css">
  <title>Resgistrarse</title>

</head>

<body>
  <header class="container-fluid py-3 header-bg">
    <div class="d-flex justify-content-between align-items-center">


      <div class="logo d-flex align-items-center">
        <a href="../index.html">
          <img src="../imagenes/Foxly.jpg" alt="logo">
        </a>
        <h4 class="ms-2 mb-0">Foxly</h4>
      </div>


      <ul class="links">
        <li>
          <a href="./nosotros.html">Nosotros</a>
        </li>
      </ul>

    </div>
  </header>


  <main>
    <section id="ini" class="iniform">
      <h2>Iniciar Sección</h2>
    </section>
    <div class="card">
      <div class="card-body">
        <form id="formulario">
          <div class="mb-3">
            <label for="exampleInputEmail1" class="form-label">Correo Electrónico</label>
            <input type="email" placeholder="julian123@gmail.com" class="form-control" id="exampleInputEmail1"
              aria-describedby="emailHelp" required>
          </div>
          <div class="mb-3">
            <label for="exampleInputPassword1" class="form-label">Contraseña</label>
            <input type="password" placeholder="12345678" class="form-control" id="exampleInputPassword1" required>
          </div>
          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="exampleCheck1" required>
            <label class="form-check-label" for="exampleCheck1"> ¿Perteces a la Institución educativa republica de
              honduras?</label>
          </div>
          <button type="button" class="btn btn-dark">Entrar</button>
        </form>
      </div>
    </div>
  </main>
  <footer>
    <p>&copy; FoxlyEducation Oficial</p>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

</body>



</html>
