<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="../css/formulario.css">
  <title>FoxlyEd - Iniciar</title>

</head>

<body>
  <header>
    <nav class="navbar navbar-expand-lg sticky-top shadow-sm" id="foxlyNav">
      <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="../inicio.html">
          <img src="../imagenes/Foxly.jpg" alt="Logo" width="40" class="me-2 logo">
          <span class="brand-text text-dark">FOXLY</span>
        </a>
        <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
          <ul class="navbar-nav ms-auto align-items-center">
            <li class="nav-item"><a class="nav-link px-3" href="./nosotros.html">Nosotros</a></li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main>
    <section id="ini" class="iniform">
      <h2>Iniciar Sesión</h2>
    </section>
    <div class="card">
      <div class="card-body">
        <form id="formulario">
          <div class="mb-3">
            <label for="exampleInputEmail1" class="form-label">Correo Electrónico</label>
            <input type="email" placeholder="julian123@gmail.com" class="form-control" id="exampleInputEmail1"
              aria-describedby="emailHelp" required>
          </div>
          <div class="mb-3">
            <label for="exampleInputPassword1" class="form-label">Contraseña</label>
            <input type="password" placeholder="12345678" class="form-control" id="exampleInputPassword1" required>
          </div>
          <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="exampleCheck1" required>
            <label class="form-check-label" for="exampleCheck1"> ¿Perteces a la Institución educativa republica de
              honduras?</label>
          </div>
          <a href="./Post_Login/menú.html" type="button" class="btn btn-dark">Entrar</a> <br><br>
          <a href="./contraseña.html" class="olvi">¿Olvidaste tu contraseña?</a>
        </form>
      </div>
    </div>
  </main>
  <footer class=" py-4 mt-5 border-top text-center">
    <p class="text-muted mb-0">© 2026 Foxly Academy - Tu futuro empieza con lo que aprendes hoy.</p>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

</body>



</html>
