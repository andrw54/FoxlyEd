<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/formulario.css">
    <title>Resgistrarse</title>

</head>

<body>
    <header class="cabeza">
        <div class="caja">
            <a href="../index.html">
                <img src="../imagenes/Foxly.jpg" alt="Logo oficial de Foxly" width="45px">
            </a>
        </div>
        <nav class="navbar">
            <ul class="links">

                <li>
                    <a href="./nosotros.html">Nosotros</a>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <section id ="ini">
            <h2>Iniciar Sección</h2>
        </section>
        <form id="formulario">
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Correo Electrónico</label>
                <input type="email" placeholder="julian123@gmail.com" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" required>
            </div>
            <div class="mb-3">
                <label for="exampleInputPassword1" class="form-label">Contraseña</label>
                <input type="password" placeholder="12345678" class="form-control" id="exampleInputPassword1" required>
            </div>
            <div class="mb-3 form-check" >
                <input type="checkbox" class="form-check-input" id="exampleCheck1" required>
                <label class="form-check-label" for="exampleCheck1"> ¿Perteces a la Institución educativa republica de honduras?</label>
            </div>
            <button type="button" class="btn btn-dark">Entrar</button>
        </form>
    </main>
    <hr>
    <footer>
        <p>&copy; FoxlyEducation Oficial</p>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>



</html>
