<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FOXLY - Subir Trabajos</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../../css/trabaprof.css">
</head>

<body>

  <nav class="navbar navbar-expand-lg sticky-top shadow-sm" id="foxlyNav">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="#">
        <img src="../../imagenes/Foxly.jpg" alt="Logo" width="40" class="me-2 logo">
        <span class="text-dark">FOXLY</span>
      </a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-center">
          <li class="nav-item ms-lg-3">
            <a href="../../inicio.html" class="btn cerrar-secion">Cerrar Sesión</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
  <main class="container py-5">
    <section class="hero-section p-4 p-md-5 mb-5">
      <div class="row align-items-center">
        <div class="col-lg-8">
          <h1 class="fw-bold mb-3">
            Gestión de Trabajos
          </h1>
          <p class="mb-4">
            Publica actividades y misiones para que los estudiantes
            completen sus tareas.
          </p>
        </div>

      </div>
    </section>
    <div class="row justify-content-center">
      <div class="col-12 col-lg-10 mx-auto">
        <div class="card custom-card p-4">
          <h3 class="mb-4">
            Crear Nuevo Trabajo
          </h3>
          <form>
            <div class="mb-3">
              <label class="form-label">
                Título del trabajo
              </label>
                            <input type="text" class="form-control custom-input"
                                placeholder="Ej: Taller de Matemáticas">
            </div>
            <div class="mb-3">
              <label class="form-label">
              </label>
            </div>
            <div class="mb-3">
              <label class="form-label">
                Descripción
              </label>
                            <textarea class="form-control custom-input" rows="5"
                                placeholder="Describe el trabajo..."></textarea>
            </div>
            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label">
                  Fecha de entrega
                </label>
                <input type="date" class="form-control custom-input">
              </div>
              <div class="col-md-6 mb-3">
                <label class="form-label">
                  Puntaje XP
                </label>
                <input type="number" class="form-control custom-input" placeholder="100 XP">
              </div>
            </div>
            <div class="mb-4">
              <label class="form-label">
                Subir archivo
              </label>
              <input type="file" class="form-control custom-input">
            </div>
            <div class="d-flex justify-content-end gap-2">
              <button type="reset" class="btn btn-outline-secondary">
                Cancelar
              </button>
              <button type="submit" class="btn btn-warning">
                Publicar Trabajo
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </main>

  <footer class=" py-4 mt-5 border-top text-center">
    <p class="text-muted mb-0">© 2026 Foxly Academy - Tu futuro empieza con lo que aprendes hoy.</p>
  </footer>

</body>

</html>
